<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <link rel="stylesheet" href="../../shared/style.css">

  <style>
    /* Timer-specific layout. All visual styling is otherwise inherited from the shared theme. */
    .timer {
      position: relative;
      display: grid;
      grid-template-rows: 1fr 40px 44px 28px;
      min-height: 210px;
      gap: 0;
      align-items: center;
      text-align: center;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.7rem, 10vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 600;
      white-space: nowrap;
    }

    .timer-message {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted, #96969c);
      font-size: 0.8rem;
      line-height: 1.35;
      padding: 0 12px;
    }

    /* One fixed action row. Buttons occupy fixed slots so state changes never reflow the row. */
    .timer-actions {
      width: 180px;
      height: 44px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 86px);
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .timer-slot {
      width: 86px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-btn {
      width: 86px;
      height: 34px;
      box-sizing: border-box;
      border: 1px solid var(--line, rgba(255,255,255,.075));
      background: var(--surface-2, #1d1d20);
      color: var(--text, #f1f1f0);
      border-radius: 10px;
      padding: 0 10px;
      font: inherit;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background .15s ease, opacity .15s ease;
    }

    .timer-btn:hover:not(:disabled) {
      background: var(--surface-3, #252529);
    }

    .timer-btn.primary {
      background: var(--accent, #f0c95a);
      color: #111;
      border-color: transparent;
      font-weight: 600;
    }

    .timer-btn.secondary {
      background: transparent;
      border-color: transparent;
      color: var(--muted, #96969c);
    }

    .timer-btn.secondary:hover:not(:disabled) {
      background: transparent;
      color: var(--text, #f1f1f0);
    }

    .timer-btn:disabled {
      display: none;
    }

    /* Invisible placeholders preserve the exact slot geometry. */
    .timer-btn[aria-hidden="true"] {
      visibility: hidden;
      pointer-events: none;
      display: block;
    }

    .timer-restart {
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .timer-restart .timer-btn {
      width: auto;
      min-width: 86px;
      height: 28px;
      font-size: 0.7rem;
    }
  </style>
</head>

<body>
  <main class="widget">
    <section class="card timer" aria-label="Timer">
      <div class="timer-display" id="display">00:00:00</div>

      <div class="timer-message" id="message">
        Sude, hazırsan başlayalım.
      </div>

      <div class="timer-actions" aria-label="Timer controls">
        <div class="timer-slot" id="slotA"></div>
        <div class="timer-slot" id="slotB"></div>
      </div>

      <div class="timer-restart">
        <button class="timer-btn secondary" id="restart">↻ Yeniden başlat</button>
      </div>
    </section>
  </main>

  <script>
    /*
      Timer state is independent from the interface.
      Future Notion integration can use:
        state.elapsedSeconds
        state.finished
        state.saved
      without changing the timer engine.
    */

    const state = {
      elapsedSeconds: 0,
      running: false,
      startedOnce: false,
      finished: false,
      saved: false,
      lastTick: null
    };

    let intervalId = null;

    const display = document.getElementById("display");
    const message = document.getElementById("message");
    const slotA = document.getElementById("slotA");
    const slotB = document.getElementById("slotB");
    const restart = document.getElementById("restart");

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return [hours, minutes, seconds]
        .map(value => String(value).padStart(2, "0"))
        .join(":");
    }

    function createButton(label, className, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `timer-btn ${className || ""}`.trim();
      button.textContent = label;
      button.addEventListener("click", handler);
      return button;
    }

    function emptySlot(slot) {
      slot.replaceChildren();
      const placeholder = document.createElement("button");
      placeholder.type = "button";
      placeholder.className = "timer-btn";
      placeholder.setAttribute("aria-hidden", "true");
      placeholder.tabIndex = -1;
      placeholder.textContent = "";
      slot.appendChild(placeholder);
    }

    function setActionRow() {
      /*
        Always render exactly two fixed-width slots.
        This is what prevents the buttons from shifting when state changes.
      */
      emptySlot(slotA);
      emptySlot(slotB);

      if (!state.startedOnce) {
        slotA.replaceChildren(
          createButton("Başlat", "primary", startTimer)
        );
        return;
      }

      if (state.finished) {
        slotA.replaceChildren(
          createButton(
            state.saved ? "Kaydedildi" : "Kaydet",
            state.saved ? "" : "primary",
            saveTimer
          )
        );
        return;
      }

      if (state.running) {
        slotA.replaceChildren(
          createButton("Duraklat", "", pauseTimer)
        );
        slotB.replaceChildren(
          createButton("Bitir", "", finishTimer)
        );
        return;
      }

      slotA.replaceChildren(
        createButton("Devam et", "primary", startTimer)
      );
      slotB.replaceChildren(
        createButton("Bitir", "", finishTimer)
      );
    }

    function render() {
      display.textContent = formatTime(state.elapsedSeconds);

      if (!state.startedOnce) {
        message.textContent = "Sude, hazırsan başlayalım.";
      } else if (state.running) {
        message.textContent = "Çalışıyoruz. ⏱️";
      } else if (state.finished && state.saved) {
        message.textContent = "Kaydedildi.";
      } else if (state.finished) {
        message.textContent = "Oturum bitti. Kaydetmeye hazır.";
      } else {
        message.textContent = "Duraklatıldı.";
      }

      setActionRow();
    }

    function tick() {
      const now = Date.now();
      const elapsed = Math.floor((now - state.lastTick) / 1000);

      if (elapsed > 0) {
        state.elapsedSeconds += elapsed;
        state.lastTick += elapsed * 1000;
        display.textContent = formatTime(state.elapsedSeconds);
      }
    }

    function startTimer() {
      if (state.running || state.finished) return;

      state.running = true;
      state.startedOnce = true;
      state.lastTick = Date.now();

      intervalId = setInterval(tick, 250);
      render();
    }

    function pauseTimer() {
      if (!state.running) return;

      tick();
      clearInterval(intervalId);
      intervalId = null;
      state.running = false;

      render();
    }

    function finishTimer() {
      if (!state.startedOnce || state.finished) return;

      if (state.running) {
        tick();
        clearInterval(intervalId);
        intervalId = null;
      }

      state.running = false;
      state.finished = true;
      state.saved = false;

      render();
    }

    function restartTimer() {
      clearInterval(intervalId);
      intervalId = null;

      state.elapsedSeconds = 0;
      state.running = false;
      state.startedOnce = false;
      state.finished = false;
      state.saved = false;
      state.lastTick = null;

      render();
    }

    function saveTimer() {
      if (!state.finished || state.saved) return;

      /*
        Future Notion integration point:
        send state.elapsedSeconds and the current date/time to the chosen
        Notion database here.
      */

      state.saved = true;
      render();
    }

    restart.addEventListener("click", restartTimer);

    render();
  </script>
</body>
</html>
