<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
.timer-widget {
  width: min(100%, 520px);
  min-height: 330px;
  padding: 4.4rem 4.5rem 3.8rem;
  gap: 0;
}

.timer-display {
  font-family: var(--font-sans);
  font-size: clamp(2.75rem, 10vw, 4.65rem);
  line-height: .95;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
}

.timer-message {
  margin-top: 1.35rem;
  min-height: 1.4em;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: .86rem;
  line-height: 1.4;
  font-weight: 500;
  font-style: normal;
}

.timer-actions {
  margin-top: 2.25rem;
  width: min(100%, 330px);
}

.timer-primary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .7rem;
  min-height: 44px;
}

.timer-primary-row.single {
  grid-template-columns: 1fr;
}

.timer-button {
  width: 100%;
}

.timer-restart {
  margin-top: .85rem;
}

@media (max-width: 480px) {
  .timer-widget {
    width: min(100%, 420px);
    min-height: 300px;
    padding: 3.5rem 2.3rem 3rem;
  }

  .timer-actions {
    width: 100%;
  }

  .timer-display {
    font-size: clamp(2.45rem, 13vw, 4rem);
  }
}  </style>
</head>
<body>
  <main class="card timer-widget">
    <div id="timerDisplay" class="timer-display" aria-live="off">00:00:00</div>
    <div id="timerMessage" class="timer-message" aria-live="polite">Hazır mısın?</div>

    <div class="timer-actions">
      <div id="primaryRow" class="timer-primary-row single">
        <button id="primaryA" class="ui-button timer-button" type="button">Başlat</button>
        <button id="primaryB" class="ui-button ui-button--secondary timer-button" type="button" hidden>Bitir</button>
      </div>
      <button id="restart" class="ui-button ui-button--secondary timer-button timer-restart" type="button">Yeniden başlat</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('timerDisplay');
    const message = document.getElementById('timerMessage');
    const primaryRow = document.getElementById('primaryRow');
    const primaryA = document.getElementById('primaryA');
    const primaryB = document.getElementById('primaryB');
    const restart = document.getElementById('restart');

    let elapsedMs = 0;
    let running = false;
    let finished = false;
    let lastTick = null;
    let rafId = null;

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
    }

    function render() {
      display.textContent = formatTime(elapsedMs);

      if (finished) {
        message.textContent = 'Tamamlandı.';
        primaryRow.classList.add('single');
        primaryA.hidden = true;
        primaryB.hidden = true;
        restart.style.display = '';
        return;
      }

      restart.style.display = '';
      primaryA.hidden = false;
      primaryB.hidden = false;
      primaryB.textContent = 'Bitir';
      primaryB.className = 'ui-button ui-button--secondary timer-button';
      primaryRow.classList.remove('single');

      if (running) {
        message.textContent = 'Devam ediyor.';
        primaryA.textContent = 'Duraklat';
      } else if (elapsedMs > 0) {
        message.textContent = 'Duraklatıldı.';
        primaryA.textContent = 'Devam et';
      } else {
        message.textContent = 'Hazır mısın?';
        primaryA.textContent = 'Başlat';
      }
    }

    function tick(now) {
      if (!running) return;
      if (lastTick !== null) elapsedMs += now - lastTick;
      lastTick = now;
      render();
      rafId = requestAnimationFrame(tick);
    }

    function startOrResume() {
      if (finished) {
        reset();
        return;
      }
      if (running) {
        running = false;
        lastTick = null;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else {
        running = true;
        lastTick = performance.now();
        rafId = requestAnimationFrame(tick);
      }
      render();
    }

    function finish() {
      if (finished) return;
      if (running) {
        const now = performance.now();
        elapsedMs += now - lastTick;
      }
      running = false;
      finished = true;
      lastTick = null;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      render();
    }

    function reset() {
      elapsedMs = 0;
      running = false;
      finished = false;
      lastTick = null;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      render();
    }

    primaryA.addEventListener('click', startOrResume);
    primaryB.addEventListener('click', finish);
    restart.addEventListener('click', reset);

    render();
  </script>
</body>
</html>
