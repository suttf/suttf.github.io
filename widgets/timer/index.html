<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <link rel="stylesheet" href="../../shared/style.css">

  <style>
    /* Timer-only layout. The visual language remains controlled by shared/style.css. */
    .timer {
      display: grid;
      grid-template-rows: 1fr 42px 44px 28px;
      min-height: 210px;
      gap: 0;
      align-items: center;
      text-align: center;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.7rem, 10vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 600;
      white-space: nowrap;
    }

    .timer-message {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted, #96969c);
      font-size: 0.8rem;
      line-height: 1.35;
      padding: 0 12px;
    }

    .timer-actions {
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .timer-secondary {
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .timer-btn {
      min-width: 82px;
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line, rgba(255,255,255,.075));
      background: var(--surface-2, #1d1d20);
      color: var(--text, #f1f1f0);
      border-radius: 10px;
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background .15s ease, transform .12s ease, opacity .15s ease;
    }

    .timer-btn:hover:not(:disabled) {
      background: var(--surface-3, #252529);
      transform: translateY(-1px);
    }

    .timer-btn.primary {
      background: var(--accent, #f0c95a);
      color: #111;
      border-color: transparent;
      font-weight: 600;
    }

    .timer-btn.secondary {
      min-width: auto;
      height: 28px;
      padding: 0 9px;
      border: 0;
      background: transparent;
      color: var(--muted, #96969c);
      font-size: 0.72rem;
    }

    .timer-btn.secondary:hover:not(:disabled) {
      background: transparent;
      color: var(--text, #f1f1f0);
      transform: none;
    }

    .timer-btn[hidden] {
      display: inline-flex;
      visibility: hidden;
      pointer-events: none;
    }

    .timer-actions .timer-btn[hidden] {
      display: inline-flex;
    }

    .timer-btn:disabled:not([hidden]) {
      opacity: .42;
      cursor: default;
    }

    @media (max-width: 360px) {
      .timer-btn {
        min-width: 76px;
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>
  <main class="widget">
    <section class="card timer" aria-label="Timer">
      <div class="timer-display" id="display">00:00:00</div>

      <div class="timer-message" id="message">
        Sude, hazırsan başlayalım.
      </div>

      <div class="timer-actions">
        <button class="timer-btn primary" id="start">Başlat</button>
        <button class="timer-btn" id="pause" hidden>Duraklat</button>
        <button class="timer-btn primary" id="resume" hidden>Devam Et</button>
        <button class="timer-btn" id="finish" hidden>Bitir</button>
        <button class="timer-btn primary" id="save" hidden>Kaydet</button>
      </div>

      <div class="timer-secondary">
        <button class="timer-btn secondary" id="restart">↻ Yeniden başlat</button>
      </div>
    </section>
  </main>

  <script>
    /*
      Timer state is deliberately independent from the UI.
      Future Notion integration can use:
        state.elapsedSeconds
        state.finished
        state.saved
      without changing the timer engine.
    */

    const state = {
      elapsedSeconds: 0,
      running: false,
      startedOnce: false,
      finished: false,
      saved: false,
      lastTick: null
    };

    let intervalId = null;

    const display = document.getElementById("display");
    const message = document.getElementById("message");

    const start = document.getElementById("start");
    const pause = document.getElementById("pause");
    const resume = document.getElementById("resume");
    const finish = document.getElementById("finish");
    const save = document.getElementById("save");
    const restart = document.getElementById("restart");

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return [hours, minutes, seconds]
        .map(value => String(value).padStart(2, "0"))
        .join(":");
    }

    function setVisible(element, visible) {
      element.hidden = !visible;
    }

    function render() {
      display.textContent = formatTime(state.elapsedSeconds);

      setVisible(start, !state.startedOnce);
      setVisible(pause, state.running);
      setVisible(resume, state.startedOnce && !state.running && !state.finished);
      setVisible(finish, state.startedOnce && !state.finished);
      setVisible(save, state.finished && !state.saved);

      if (!state.startedOnce) {
        message.textContent = "Sude, hazırsan başlayalım.";
      } else if (state.running) {
        message.textContent = "Çalışıyoruz. ⏱️";
      } else if (state.finished && state.saved) {
        message.textContent = "Kaydedildi.";
      } else if (state.finished) {
        message.textContent = "Oturum bitti. Kaydetmek ister misin?";
      } else {
        message.textContent = "Duraklatıldı.";
      }
    }

    function tick() {
      const now = Date.now();
      const elapsed = Math.floor((now - state.lastTick) / 1000);

      if (elapsed > 0) {
        state.elapsedSeconds += elapsed;
        state.lastTick += elapsed * 1000;
        display.textContent = formatTime(state.elapsedSeconds);
      }
    }

    function startTimer() {
      if (state.running || state.finished) return;

      state.running = true;
      state.startedOnce = true;
      state.lastTick = Date.now();

      intervalId = setInterval(tick, 250);
      render();
    }

    function pauseTimer() {
      if (!state.running) return;

      tick();
      clearInterval(intervalId);
      intervalId = null;
      state.running = false;

      render();
    }

    function finishTimer() {
      if (!state.startedOnce || state.finished) return;

      if (state.running) {
        tick();
        clearInterval(intervalId);
        intervalId = null;
      }

      state.running = false;
      state.finished = true;
      state.saved = false;

      render();
    }

    function restartTimer() {
      clearInterval(intervalId);
      intervalId = null;

      state.elapsedSeconds = 0;
      state.running = false;
      state.startedOnce = false;
      state.finished = false;
      state.saved = false;
      state.lastTick = null;

      render();
    }

    function saveTimer() {
      if (!state.finished || state.saved) return;

      /*
        Future Notion integration:
        send state.elapsedSeconds and the current date/time
        to the selected Notion database here.
      */

      state.saved = true;
      render();
    }

    start.addEventListener("click", startTimer);
    pause.addEventListener("click", pauseTimer);
    resume.addEventListener("click", startTimer);
    finish.addEventListener("click", finishTimer);
    restart.addEventListener("click", restartTimer);
    save.addEventListener("click", saveTimer);

    render();
  </script>
</body>
</html>
