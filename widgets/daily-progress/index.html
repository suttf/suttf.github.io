<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>daily-progress</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/config.js"></script>
</head><body><div class="widget"><div class="label">Daily Progress</div><div class="value" id="value"></div><div class="sub" id="sub"></div></div>
<script>
const c=window.WIDGET_CONFIG||{},pct=Math.min(100,(c.studyTodayHours||0)/(c.dailyGoalHours||1)*100);
document.getElementById("value").textContent=`${Math.round(pct)}%`;
document.getElementById("sub").textContent=`${c.studyTodayHours||0}h / ${c.dailyGoalHours||0}h goal`;
</script></body></html>
