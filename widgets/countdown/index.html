<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>countdown</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/config.js"></script>
</head><body><div class="widget"><div class="label">Countdown</div><div class="value" id="value">--</div><div class="sub">1 January 2027</div></div>
<script>
const target=new Date("2027-01-01T00:00:00");
function tick(){
 const diff=Math.max(0,target-Date.now());
 const days=Math.floor(diff/86400000);
 const hours=Math.floor(diff%86400000/3600000);
 document.getElementById("value").textContent=`${days}d ${hours}h`;
}
tick();setInterval(tick,60000);
</script></body></html>
