<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    /* Clock-specific hierarchy. The shared stylesheet handles the visual system. */
    .clock-widget {
      width: min(100%, 420px);
      min-height: 250px;
      padding: 3.4rem 3.8rem;
      gap: 0.8rem;
    }

    .clock-time {
      font-size: clamp(2.8rem, 9vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: -0.065em;
      white-space: nowrap;
    }

    .clock-date {
      font-size: clamp(0.72rem, 2vw, 0.84rem);
      line-height: 1.3;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .clock-widget {
        width: min(100%, 380px);
        min-height: 220px;
        padding: 2.7rem 2.2rem;
      }

      .clock-time {
        font-size: clamp(2.55rem, 13vw, 3.7rem);
      }
    }
  </style>
</head>
<body>
  <main class="card clock-widget" style="--accent: var(--rose)">
    <time class="readout clock-time" id="time" aria-label="Current time">--:--:--</time>
    <div class="label clock-date" id="date-label" aria-live="polite"></div>
  </main>

  <script type="module">
    import { applyTheme } from '../../shared/utils.js';

    applyTheme();

    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date-label');

    const formatter = new Intl.DateTimeFormat(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric'
    });

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function render() {
      const now = new Date();
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());

      timeEl.textContent = `${hours}:${minutes}:${seconds}`;
      timeEl.dateTime = now.toISOString();
      timeEl.setAttribute('aria-label', `Current time ${hours}:${minutes}:${seconds}`);
      dateEl.textContent = formatter.format(now);
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
