<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>study-time</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/config.js"></script>
</head><body><div class="widget"><div class="label">Study Time</div><div class="value" id="value"></div><div class="sub">today</div></div>
<script>
const h=window.WIDGET_CONFIG?.studyTodayHours ?? 0;
const total=Math.round(h*60);
document.getElementById("value").textContent=`${Math.floor(total/60)}h ${total%60}m`;
</script></body></html>
