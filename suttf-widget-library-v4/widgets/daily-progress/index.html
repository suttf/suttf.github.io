<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>daily-progress</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/config.js"></script>
</head>
<body><div class="widget">
  <div class="row">
    <div class="label"><span class="icon">◒</span> Today's progress</div>
    <span class="tiny" id="goal"></span>
  </div>
  <div class="value" id="value"></div>
  <div class="progress" style="margin-top:17px"><div id="bar"></div></div>
</div>
<script>
const c=window.WIDGET_CONFIG||{},pct=Math.min(100,(c.studyTodayHours||0)/(c.dailyGoalHours||1)*100);
value.textContent=`${Math.round(pct)}%`;
goal.textContent=`${c.studyTodayHours||0}h / ${c.dailyGoalHours||0}h`;
bar.style.width=`${pct}%`;
</script></body>
</html>
